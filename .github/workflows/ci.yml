name: QuantLab Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI only needs to read source code; no tokens or credentials are required.
permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']

    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies in a clean runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify installed dependency consistency
        run: python -m pip check

      - name: Run full pytest suite
        run: python -m pytest tests/ -q

      # Exercise the actual .bat from an isolated project virtual environment.
      # Windows-only: Ubuntu still runs the normal Python test matrix above.
      - name: Create clean Windows launcher virtualenv
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m venv .venv

      - name: Install runtime dependencies in launcher virtualenv
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m pip check

      - name: Smoke test Windows double-click launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tools/ci_smoke_launcher.py
